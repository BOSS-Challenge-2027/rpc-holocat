name: CI
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  functional-tests:
    name: 'Ubuntu 24.04, functional tests'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      # Write access is only used by the template repository to publish the ccache.
      contents: write
    env:
      # GitHub's actions/cache is scoped to a single repository, so the ccache is
      # instead published as a release asset on the template repository. Every
      # repository created from the template downloads it from there, and only
      # the template repository itself uploads it.
      CCACHE_RELEASE_TAG: ccache-ubuntu-24.04
      CCACHE_ASSET: ccache.tar
      CCACHE_DIR: /home/runner/.ccache
      # Release assets must be under 2 GiB.
      CCACHE_MAXSIZE: 1G
      # ccache hashes absolute paths, and the checkout path contains the
      # repository name. Build from a fixed path so every repository produces
      # identical compiler command lines and can reuse each other's objects.
      SRC_DIR: /home/runner/bitcoin
      # With --failfast, stop test_runner.py from killing its process group (and this step) on failure.
      CI_FAILFAST_TEST_LEAVE_DANGLING: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Copy source to a fixed path
        run: cp -a "$GITHUB_WORKSPACE/." "$SRC_DIR"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build pkgconf python3-zmq \
            libboost-dev libsqlite3-dev libzmq3-dev

      - name: Determine ccache source repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The template uses its own cache. Repositories created from it report it
          # in `template_repository`, and forks of it report it in `parent`.
          repo=$(gh api "repos/${GITHUB_REPOSITORY}" --jq \
            'if .is_template then .full_name else (.template_repository.full_name // .parent.full_name // .full_name) end')
          echo "CCACHE_REPO=${repo}" >> "$GITHUB_ENV"
          echo "Using ccache from ${repo}"

      - name: Restore ccache
        env:
          # The template repository is public, so any repository's token can read its releases.
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$CCACHE_DIR"
          if gh release download "$CCACHE_RELEASE_TAG" --repo "$CCACHE_REPO" --pattern "$CCACHE_ASSET" --dir "$RUNNER_TEMP"; then
            tar -xf "$RUNNER_TEMP/$CCACHE_ASSET" -C "$CCACHE_DIR"
            rm "$RUNNER_TEMP/$CCACHE_ASSET"
          else
            echo "::warning title=ccache::No ccache found in ${CCACHE_REPO}, building from scratch"
          fi
          ccache --zero-stats
          ccache --show-stats
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Configure
        working-directory: ${{ env.SRC_DIR }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=ON \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON

      - name: Build
        working-directory: ${{ env.SRC_DIR }}
        run: cmake --build build -j "$(nproc)"

      - name: ccache stats
        run: |
          ccache --show-stats --verbose
          {
            echo '### ccache'
            echo '```'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache
        # Only the template repository publishes the cache, so student
        # repositories can neither break nor bloat it.
        if: >-
          env.CCACHE_REPO == github.repository &&
          github.event_name != 'pull_request' &&
          github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drop entries not used by this build so the cache doesn't grow forever.
          ccache --evict-older-than "$(( $(date +%s) - BUILD_START + 60 ))s"
          ccache --show-stats
          tar -cf "$RUNNER_TEMP/$CCACHE_ASSET" -C "$CCACHE_DIR" .
          if ! gh release view "$CCACHE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$CCACHE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "ccache (Ubuntu 24.04)" \
              --notes "Shared ccache used by CI in repositories created from this template. Updated automatically."
          fi
          gh release upload "$CCACHE_RELEASE_TAG" "$RUNNER_TEMP/$CCACHE_ASSET" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Run functional tests
        working-directory: ${{ env.SRC_DIR }}
        run: |
          python3 build/test/functional/test_runner.py \
            -j "$(( $(nproc) * 2 ))" \
            --tmpdirprefix "$RUNNER_TEMP/functional" \
            --failfast \
            --combinedlogslen=4000

      - name: Upload functional test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: functional-test-logs
          path: ${{ runner.temp }}/functional
          retention-days: 7
